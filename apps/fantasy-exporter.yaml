apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fantasy-exporter
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ConnorGoodman/homelab-gitops.git
    targetRevision: main
    path: apps/fantasy-exporter
    helm:
      releaseName: fantasy-exporter
  destination:
    server: https://kubernetes.default.svc
    namespace: fantasy-exporter
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true