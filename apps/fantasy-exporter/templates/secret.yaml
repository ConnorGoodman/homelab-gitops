{{- if and .Values.espnCredentials.enabled (not .Values.espnCredentials.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: fantasy-exporter-espn
type: Opaque
stringData:
  ESPN_SWID: {{ .Values.espnCredentials.swid | quote }}
  ESPN_S2: {{ .Values.espnCredentials.s2 | quote }}
{{- end }}
{{- if and .Values.gitSync.enabled (not .Values.gitSync.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: fantasy-exporter-github
type: Opaque
stringData:
  token: {{ .Values.gitSync.token | quote }}
{{- end }}