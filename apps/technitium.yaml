apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: technitium
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ConnorGoodman/homelab-gitops.git
    targetRevision: main
    path: apps/technitium
    helm:
      releaseName: technitium
  destination:
    server: https://kubernetes.default.svc
    namespace: technitium-dns
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
