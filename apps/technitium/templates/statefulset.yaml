apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: technitium
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: technitium-headless
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: technitium
  template:
    metadata:
      labels:
        app: technitium
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: technitium
              topologyKey: kubernetes.io/hostname
        {{- if .Values.nodeAffinity }}
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role
                    operator: In
                    values:
                      - dns-primary
                      - dns-secondary
        {{- end }}
      containers:
        - name: technitium
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 53
              protocol: UDP
            - containerPort: 53
              protocol: TCP
            - containerPort: 5380
              name: web
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DNS_SERVER_DOMAIN
              value: "$(POD_NAME).technitium-headless.$(POD_NAMESPACE).svc.cluster.local"
          volumeMounts:
            - name: data
              mountPath: /etc/dns
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.persistence.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}